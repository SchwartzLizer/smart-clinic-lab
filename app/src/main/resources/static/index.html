<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Clinic Management System</title>
  <link rel="icon" href="./assets/images/logo/logo.png">
  <link rel="stylesheet" href="./assets/css/style.css"><link rel="stylesheet" href="./assets/css/index.css">
  <script src="./js/render.js" defer></script><script src="./js/components/header.js" defer></script><script src="./js/components/footer.js" defer></script>
</head>
<body>
  <div class="wrapper"><div id="header"></div>
    <main class="main-content"><section class="role-panel">
      <img src="./assets/images/logo/logo.png" alt="Smart Clinic" class="clinic-logo">
      <p class="eyebrow">SMART CLINIC</p><h1>Healthcare, made simple.</h1>
      <p class="lead">Choose your portal to manage doctors, appointments, and patient care.</p>
      <div class="role-grid">
        <button id="adminLogin" class="role-card"><strong>Admin Portal</strong><span>Manage clinic doctors</span></button>
        <button id="doctorLogin" class="role-card"><strong>Doctor Portal</strong><span>View patient appointments</span></button>
        <button id="patientLogin" class="role-card"><strong>Patient Portal</strong><span>Find doctors and book visits</span></button>
      </div>
    </section></main><div id="footer"></div>
  </div>
  <div id="modal" class="modal"><div class="modal-content"><button id="closeModal" class="close" aria-label="Close">&times;</button><div id="modal-body"></div></div></div>
  <script type="module" src="./js/services/index.js"></script>
</body></html>
