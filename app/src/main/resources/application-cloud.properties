spring.config.activate.on-profile=cloud

# Cloud uses schema/procedure migrations only. Shared forward migrations begin at V5.
spring.flyway.locations=classpath:db/cloud-migration,classpath:db/common-migration
spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USERNAME}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

app.demo-data.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
info.app.version=${APP_VERSION}
info.app.revision=${APP_REVISION}
info.app.environment=${APP_ENVIRONMENT}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
