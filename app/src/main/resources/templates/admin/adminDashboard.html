<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}"><link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <script th:src="@{/js/components/header.js}" defer></script><script th:src="@{/js/components/footer.js}" defer></script>
</head><body><div class="wrapper"><div id="header"></div>
  <main class="main-content dashboard-shell">
    <div class="dashboard-heading"><div><p class="eyebrow">ADMIN PORTAL</p><h1>Doctor Management</h1></div><button id="addDoctorBtn" class="adminBtn">+ Add Doctor</button></div>
    <div class="filter-bar"><input id="searchBar" placeholder="Search by doctor name"><select id="timeFilter"><option value="all">Any time</option><option>AM</option><option>PM</option></select><select id="specialtyFilter"><option value="all">All specialties</option><option>Cardiologist</option><option>Dermatologist</option><option>Neurologist</option><option>Pediatrician</option><option>Orthopedist</option></select></div>
    <div id="content" class="doctor-grid"></div>
  </main><div id="footer"></div></div>
  <div id="modal" class="modal"><div class="modal-content"><button id="closeModal" class="close">&times;</button><div id="modal-body"></div></div></div>
  <script type="module" th:src="@{/js/adminDashboard.js}"></script>
</body></html>
