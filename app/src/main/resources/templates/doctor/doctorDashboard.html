<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Dashboard</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}"><link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
  <script th:src="@{/js/components/header.js}" defer></script><script th:src="@{/js/components/footer.js}" defer></script>
</head><body><div class="wrapper"><div id="header"></div>
  <main class="main-content dashboard-shell"><div class="dashboard-heading"><div><p class="eyebrow">DOCTOR PORTAL</p><h1>Patient Appointments</h1></div></div>
    <div class="filter-bar"><input id="searchBar" placeholder="Search patient name"><button id="todayButton">Today's appointments</button><input type="date" id="datePicker"></div>
    <div class="table-card"><table id="patientTable"><thead><tr><th>Patient ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Appointment</th><th>Prescription</th></tr></thead><tbody id="patientTableBody"></tbody></table><p id="emptyState" class="empty-state" hidden>No appointments found.</p></div>
  </main><div id="footer"></div></div>
  <script type="module" th:src="@{/js/doctorDashboard.js}"></script>
</body></html>
