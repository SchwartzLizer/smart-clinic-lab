# Unit/MVC tests exclude external health contributors; the integration profile
# keeps the production readiness group strict when MySQL and MongoDB are present.
management.endpoint.health.validate-group-membership=false
spring.datasource.url=jdbc:mysql://localhost:3306/smart_clinic
spring.datasource.username=smart_clinic
spring.datasource.password=smart-clinic-local-only
spring.data.mongodb.uri=mongodb://smart_clinic:smart-clinic-local-only@localhost:27017/prescriptions?authSource=admin
jwt.secret=test-signing-key-that-is-at-least-32-bytes-long
app.cors.allowed-origins=http://localhost:8080
app.mongo.index.enabled=false
