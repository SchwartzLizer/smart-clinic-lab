services:
  - type: web
    name: smart-clinic-api
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Dedicated migration identity; must differ from DB_USERNAME.
      - key: FLYWAY_DB_URL
        sync: false
      - key: FLYWAY_DB_USERNAME
        sync: false
      - key: FLYWAY_DB_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: PT1H
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      # Exact public origins only; do not use localhost in cloud.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_VERSION
        sync: false
      - key: APP_REVISION
        sync: false
      - key: APP_ENVIRONMENT
        value: cloud
      # One-time cloud identity bootstrap. Keep disabled unless all managed values exist.
      - key: APP_BOOTSTRAP_ENABLED
        value: "false"
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_DOCTOR_NAME
        sync: false
      - key: APP_BOOTSTRAP_DOCTOR_SPECIALTY
        sync: false
      - key: APP_BOOTSTRAP_DOCTOR_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_DOCTOR_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_DOCTOR_PHONE
        sync: false
      - key: APP_BOOTSTRAP_DOCTOR_AVAILABLE_TIMES
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0
