services:
  - type: web
    name: smart-clinic-api
    runtime: docker
    plan: free
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: PT1H
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0
